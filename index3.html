<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Multiscale Integration — Alberto Albesa</title>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d1117;
  --ink2: #3b4252;
  --ink3: #6e7a8a;
  --rule: #d0d7e0;
  --rule2: #e8ecf0;
  --bg: #f7f5f0;
  --bg2: #ffffff;
  --quantum: #1a3a5c;
  --quantum-light: #e8f0f8;
  --mc: #1a4a2e;
  --mc-light: #e8f4ec;
  --md: #3a1a4a;
  --md-light: #f0e8f8;
  --cg: #4a2a1a;
  --cg-light: #f8f0e8;
  --theory: #1a3a4a;
  --theory-light: #e8f4f8;
  --pnp: #3a2a1a;
  --pnp-light: #f8f4e8;
  --accent: #c8a96e;
  --problem: #8b2020;
  --solution: #1a4a2e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  /* ~15px en 768px (notebook 15"), 16px en pantallas más grandes */
  font-size: clamp(14px, 2vh, 16px);
}

body {
  overflow: hidden;
  background: var(--bg);
  font-family: 'Space Grotesk', sans-serif;
  color: var(--ink);
  height: 100vh;
}

/* ── Deck ── */
.deck {
  display: flex;
  height: 100vh;
  transition: transform 0.55s cubic-bezier(0.77, 0, 0.175, 1);
}

.slide {
  width: 100vw;
  height: 100vh;
  flex-shrink: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}

/* ── Header bar ── */
.slide-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 3rem;
  border-bottom: 1px solid var(--rule);
  background: var(--bg2);
  z-index: 10;
}

.slide-header .level-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink3);
  border: 1px solid var(--rule);
  padding: 0.3rem 0.75rem;
  border-radius: 2rem;
}

.slide-header .atlas-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 0.3rem 0.75rem;
  border-radius: 2rem;
}

.slide-header .header-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

/* ── Footer bar ── */
.slide-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.5rem 3rem;
  border-top: 1px solid var(--rule);
  background: var(--bg2);
}

.slide-footer .attribution {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--ink3);
  letter-spacing: 0.08em;
}

.progress-track {
  flex: 1;
  max-width: 160px;
  height: 2px;
  background: var(--rule2);
  border-radius: 1px;
  overflow: hidden;
  margin: 0 1.5rem;
}

.progress-fill {
  height: 100%;
  background: var(--ink2);
  border-radius: 1px;
  transition: width 0.3s;
}

.slide-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--ink3);
}

/* ── Content area ── */
.slide-body {
  padding: 1.25rem 3rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--rule) transparent;
}

/* ── Type: title ── */
.slide-title-wrap {
  max-width: 780px;
}

.slide-title-wrap .eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 1.25rem;
}

.slide-title-wrap h1 {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 5rem;
  font-weight: 400;
  line-height: 1.08;
  color: var(--ink);
  margin-bottom: 1.5rem;
}

.slide-title-wrap .sub {
  font-size: 1.35rem;
  color: var(--ink2);
  font-weight: 300;
  line-height: 1.6;
  max-width: 520px;
}

.title-rule {
  width: 3rem;
  height: 2px;
  background: var(--accent);
  margin: 1.75rem 0;
}

/* ── Type: section ── */
.section-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 100%;
}

.section-wrap .level-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 1rem;
}

.section-wrap h2 {
  font-family: 'EB Garamond', serif;
  font-size: 4rem;
  font-weight: 400;
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: 0.75rem;
}

.section-wrap .section-q {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 1.75rem;
  color: var(--ink2);
}

/* ── Type: text (theoretical) ── */
.text-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  align-items: start;
}

.text-wrap.single {
  grid-template-columns: 1fr;
  max-width: 680px;
}

.text-left h3 {
  font-family: 'EB Garamond', serif;
  font-size: 2.9rem;
  font-weight: 400;
  line-height: 1.15;
  margin-bottom: 1.25rem;
  color: var(--ink);
}

.text-left .body-text {
  font-size: 1.2rem;
  line-height: 1.7;
  color: var(--ink2);
  font-weight: 300;
}

.text-left .body-text strong {
  font-weight: 500;
  color: var(--ink);
}

.text-right {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* Key insight box */
.insight-box {
  border-left: 3px solid var(--accent);
  padding: 1rem 1.25rem;
  background: var(--bg2);
  border-radius: 0 6px 6px 0;
}

.insight-box .insight-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 0.4rem;
}

.insight-box p {
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--ink2);
}

/* Level badge for text slides */
.level-stripe {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
}

/* ── Type: glass (equation) ── */
.eq-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  align-items: center;
}

.eq-left h3 {
  font-family: 'EB Garamond', serif;
  font-size: 2.7rem;
  font-weight: 400;
  margin-bottom: 1.5rem;
  color: var(--ink);
}

.eq-box {
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 2rem;
  font-size: 2rem;
  text-align: center;
  min-height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.eq-caption {
  margin-top: 1rem;
  font-size: 1.05rem;
  color: var(--ink3);
  line-height: 1.6;
  font-style: italic;
}

.eq-right {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.eq-point {
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  padding: 0.75rem 1rem;
  background: var(--bg2);
  border: 1px solid var(--rule2);
  border-radius: 6px;
}

.eq-point .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 0.45rem;
  flex-shrink: 0;
}

.eq-point p {
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--ink2);
}

/* ── Type: problem ── */
.problem-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.5rem;
  max-width: 680px;
}

.problem-eyebrow {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.problem-badge {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #8b2020;
  border: 1px solid #8b2020;
  padding: 0.25rem 0.65rem;
  border-radius: 2rem;
}

.problem-wrap h3, .problem-wrap-with-img h3 {
  font-family: 'EB Garamond', serif;
  font-size: 3.4rem;
  font-weight: 400;
  line-height: 1.1;
  color: var(--ink);
}

.problem-context {
  font-size: 1.15rem;
  color: var(--ink2);
  font-weight: 300;
  padding: 1rem 1.25rem;
  border-left: 3px solid #d4a0a0;
  background: #fdf5f5;
  border-radius: 0 6px 6px 0;
}

/* ── Type: solution ── */
.solution-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  align-items: start;
}

.solution-left h3 {
  font-family: 'EB Garamond', serif;
  font-size: 2.7rem;
  font-weight: 400;
  line-height: 1.15;
  color: var(--ink);
  margin-bottom: 0.5rem;
}

.solution-left .method-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--ink3);
  margin-bottom: 1.25rem;
  display: block;
}

.solution-left .finding {
  font-size: 1.15rem;
  line-height: 1.7;
  color: var(--ink2);
  font-weight: 300;
}

.decision-card {
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 1.5rem;
  border-top: 3px solid var(--solution);
}

.decision-card .dec-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--solution);
  margin-bottom: 0.75rem;
}

.decision-card .dec-text {
  font-size: 1.25rem;
  line-height: 1.65;
  color: var(--ink);
  font-weight: 400;
}

/* ── Type: table ── */
.table-wrap h3 {
  font-family: 'EB Garamond', serif;
  font-size: 2.5rem;
  font-weight: 400;
  margin-bottom: 1.5rem;
  color: var(--ink);
}

.methods-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 1rem;
}

.methods-table thead th {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink3);
  text-align: left;
  padding: 0.5rem 0.75rem;
  border-bottom: 2px solid var(--rule);
}

.methods-table tbody td {
  padding: 0.65rem 0.75rem;
  border-bottom: 1px solid var(--rule2);
  color: var(--ink2);
  vertical-align: top;
  line-height: 1.5;
}

.methods-table tbody td:first-child {
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
}

.methods-table tbody td:nth-child(2) {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--ink3);
}

.methods-table tbody tr:last-child td {
  border-bottom: none;
}

.methods-table tbody tr:hover td {
  background: var(--bg2);
}

/* ── Type: final ── */
.final-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  height: 100%;
  max-width: 700px;
}

.final-wrap h1 {
  font-family: 'EB Garamond', serif;
  font-size: 4.4rem;
  font-weight: 400;
  font-style: italic;
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: 2rem;
}

.final-wrap .contact {
  font-family: 'DM Mono', monospace;
  font-size: 0.85rem;
  color: var(--ink3);
  letter-spacing: 0.05em;
}

/* ── Level color map ── */
.level-FOUNDATION   { background: #94a3b8; }
.level-QUANTUM      { background: var(--quantum); }
.level-BRIDGE       { background: #64748b; }
.level-MC           { background: var(--mc); }
.level-DYNAMICS     { background: var(--md); }
.level-COARSE       { background: var(--cg); }
.level-THEORY       { background: var(--theory); }
.level-CONTINUUM    { background: var(--pnp); }
.level-CLOSING      { background: var(--accent); }

/* bg tint for section slides (optional) */
.section-tint-QUANTUM   { background: #f0f4f8; }
.section-tint-MC        { background: #f0f7f3; }
.section-tint-DYNAMICS  { background: #f5f0f8; }
.section-tint-COARSE    { background: #f8f3f0; }
.section-tint-THEORY    { background: #f0f6f8; }
.section-tint-CONTINUUM { background: #f8f5f0; }

/* ── Nav arrows ── */
.nav-btn {
  position: fixed;
  bottom: 50px;
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  transition: background 0.15s, border-color 0.15s;
  color: var(--ink2);
  font-size: 1rem;
}

.nav-btn:hover { background: var(--ink); color: white; border-color: var(--ink); }
.nav-btn.prev { left: calc(50% - 52px); }
.nav-btn.next { right: calc(50% - 52px); }

/* image placeholder */
.img-placeholder {
  border: 1.5px dashed var(--rule);
  border-radius: 6px;
  padding: 1.5rem;
  text-align: center;
  background: var(--bg2);
}

.img-placeholder .img-title {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 0.5rem;
}

.img-placeholder .img-desc {
  font-size: 0.8rem;
  color: var(--ink3);
  font-style: italic;
  line-height: 1.5;
}

/* ── Paper images in cases ── */
.problem-wrap-with-img {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2.5rem;
  align-items: center;
  max-width: none;
}

.problem-wrap-with-img .problem-text {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  max-width: 580px;
}

.paper-img-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}

.paper-img {
  max-width: 100%;
  max-height: 340px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--rule);
  background: white;
}

.paper-img-caption {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--ink3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.solution-images {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 1rem;
}

.solution-images img {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--rule);
  background: white;
}

.solution-wrap-3col {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1.5rem;
  align-items: start;
}
</style>
</head>

<div class="deck" id="deck"></div>

<button class="nav-btn prev" id="prevBtn">&#8592;</button>
<button class="nav-btn next" id="nextBtn">&#8594;</button>

const LEVEL_COLORS = {

  'CONTINUUM': '#3a2a1a',
  'CLOSING': '#c8a96e'

const slideData = [
  // INTRO
  { type:'title', title:'Computational Methods for the Design of Adsorptive and Separation Materials', subtitle:'From Molecular Simulations to Continuum Models', scale:'FOUNDATION' },
  { type:'text', title:'The Fundamental Question',
    body:'How do we design materials that <strong>separate, capture, or transport</strong> molecules with precision and efficiency?',

    ], scale:'FOUNDATION',

  <text x="272" y="36" font-size="8" font-family="monospace" fill="#1a3a5c">DFT (N³)</text>

  { type:'text', title:'The Solution: Hierarchy of Approximations',
    body:'We sacrifice <strong>detail to gain scale</strong>. The key is knowing exactly what is lost at each approximation and when that sacrifice is acceptable.',
    insights:[
      { label:'Rational design', text:'We do not test materials at random. We design them from first principles, predicting properties before synthesis.' },
      { label:'Integration', text:'DFT → MC → Molecular Theory → PNP: each level feeds the next with validated parameters.' }
    ], scale:'FOUNDATION',
    svg:`<svg viewBox="0 0 300 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;border:1px solid #d0d7e0;border-radius:6px;background:#fff;">
  <!-- boxes -->
  <rect x="8" y="44" width="54" height="28" rx="4" fill="#e8f0f8" stroke="#1a3a5c" stroke-width="1.2"/>

  { type:'text', title:'Hohenberg-Kohn Theorems',

      { label:'Parameters for MC', text:'Interaction energies calculated by DFT become the force fields that feed Monte Carlo simulations at the next level.' }
    ], scale:'QUANTUM',

  // DFT METHODOLOGY
  { type:'section', title:'Fundamental Considerations in a DFT Calculation', subtitle:'Functional, Basis Sets, and Solvent Model', scale:'QUANTUM' },

  { type:'glass', title:'The Kohn-Sham Formalism',
    eq:'\\[ \\left[-\\tfrac{1}{2}\\nabla^2 + v_{\\mathrm{KS}}(\\mathbf{r})\\right]\\varphi_i = \\varepsilon_i\\,\\varphi_i \\]',
    caption:'v_KS = v + v_J + v_xc. The loop is exact if E_xc[ρ] is known. E_xc accounts for the non-classical part of the e-e repulsion and the kinetic difference T − T_s.',
    points:[
      'The central problem: E_xc functional, basis set, and solvent model determine calculation quality. Their errors can couple, cancel, or amplify in unpredictable ways.',
      'Unlike post-Hartree-Fock methods, DFT does not offer a systematic procedure to successively improve approximations with guaranteed convergence to the exact result.',
      'There is no guarantee that a functional that works well for one property will work well for another. The choice must be guided by the target property.'
    ], scale:'QUANTUM' },

  { type:'text', title:'The E_xc Functional: Hierarchy of Approximations',
    body:'The choice of functional must be <strong>guided by the target property</strong> and validated against experimental data or reference calculations. There is no systematic ladder of improvement as in post-HF methods.',
    insights:[
      { label:'LDA → GGA', text:'LDA is based on the homogeneous electron gas: well-defined but overestimates binding energies. GGA incorporates ρ and ∇ρ, substantially improving energetics.' },
      { label:'Hybrid Functionals', text:'Justified by the adiabatic connection formula. B3LYP mixes HF exchange into E_xc. CAM-B3LYP and ωB97X-D are preferred for charge transfer. D3/D4 corrections for dispersion.' },
      { label:'Key Warning', text:'A functional that is excellent for geometries may fail for electronic affinities. Magnetic properties (NMR) require specifically validated functionals.' }
    ], scale:'QUANTUM' },

  { type:'text', title:'The Basis Set: Diffuse Functions and Convergence',
    body:'Expanding orbitals in a finite basis set introduces a <strong>truncation error that interacts with the choice of functional</strong>. Basis set size can change the prediction of which structure is more stable.',
    insights:[
      { label:'Diffuse Functions', text:'Essential for polarizabilities, electron affinities, and anions, where density extends significantly beyond the nuclear region.' },
      { label:'Magnetic Properties (NMR)', text:'Requires flexibility in both the nuclear and valence regions. The basis must correctly describe the magnetic field induced by electrons.' },
      { label:'Practical Rule', text:'Triple-zeta with polarization and diffuse functions (6-311++G(2d,2p)) is a reasonable starting point. Always verify convergence with a larger basis before publishing.' }
    ], scale:'QUANTUM' },

  { type:'glass', title:'The Solvent Model: Non-linear Coupling',
    eq:'\\[ G_{\\mathrm{el}} = \\langle\\Psi|\\hat{H}_{\\mathrm{eff}}|\\Psi\\rangle - \\tfrac{1}{2}\\langle\\Psi|\\hat{V}_R|\\Psi\\rangle \\]',
    caption:'The ½ factor accounts for the polarization work. The energy functional takes on the character of free energy. A vacuum calculation can yield qualitatively incorrect results for systems in solution.',
    points:[
      'Continuum models replace the solvent with a dielectric of permittivity ε. Media polarization is represented by an apparent surface charge distribution σ(s) on the solute-solvent boundary.',
      'The key is non-linearity: σ depends on the potential V_M, which depends on the wavefunction, which is solved with a Hamiltonian including the interaction with σ. The cycle closes self-consistently.',
      'The solvent does not just correct the energy—it modifies the solute\'s charge distribution, and that modified distribution determines all calculated properties.'
    ], scale:'QUANTUM' },

  { type:'table', title:'Continuum Solvent Models: IEFPCM, CPCM, and SMD', scale:'QUANTUM',
    rows:[
      ['IEFPCM', 'Integral Equation', 'S and D operators over the molecular cavity. Correctly handles charge penetration outside the cavity. Extensible to anisotropic media. Mathematically robust.', 'General reference, charged systems'],
      ['CPCM', 'Conductor-like', 'Assumes ε → ∞ and corrects with f(ε) = (ε−1)/(ε+x). Computationally simpler. Less accurate for low-polarity solvents.', 'Polar solvents, fast calculations'],
      ['SMD', 'IEFPCM + G_CDS', 'G_sol = G_el + G_CDS. Atomic surface tensions parameterize cavitation, dispersion, and solvent structure against experimental free energy of solvation data.', 'Zwitterions, protic solvents, free energies']
    ]},

  { type:'problem', title:'What is the Predominant Species of Glyphosate in Solution?', subtitle:'The Controversy Over the Deprotonation Sequence', atlas:'Atlas #3', scale:'QUANTUM' },
  { type:'solution', title:'B3LYP / 6-311++G(2d,2p) / SMD Resolves the Controversy', method:'B3LYP · 6-31G(d,p) vs 6-311++G(2d,2p) · IEFPCM vs SMD', finding:'With 6-31G(d,p), GLY²⁻ in water appears as species 4101, but experimental XPS shows 4200. Increasing to 6-311++G(2d,2p), the prediction reverses and 4200 becomes the most stable (58%)—diffuse functions are essential for anions. With IEFPCM, the non-ionized neutral form 4112 appears most stable; SMD correctly captures zwitterion 4211 stabilization in protic solvents through its treatment of non-electrostatic contributions. ³¹P NMR analysis confirms the sequence 4100→4200→4201→4211.', decision:'The three decisions are coupled: insufficient basis set gives the wrong species; a purely electrostatic solvent model fails to capture zwitterion stabilization. The B3LYP/6-311++G(2d,2p)/SMD combination resolved a long-standing controversy over the glyphosate deprotonation sequence.', scale:'QUANTUM', solutionImgs:['imagenes_extraidas_metadatos/1-s2_0-S2667022422000780-main__1_/img_p2_3.png','imagenes_extraidas_metadatos/1-s2_0-S2667022422000780-main__1_/img_p3_6.png'] },

  { type:'problem', title:'Which Tautomeric Form Predominates and How Do Substituents Influence It?', subtitle:'Nitrile–Ketenimine Equilibrium in Unsaturated Malononitriles: Isotopic MS + DFT', atlas:'Atlas #16', scale:'QUANTUM' },
  { type:'solution', title:'B3LYP / 6-311++G(d,p) / Vacuum: Three Decisions Consistent with Experiment', method:'B3LYP · 6-311++G(d,p) · No solvent model (Gas-phase MS)', finding:'The goal is to compare the relative stability of tautomers (nitrile, ketenimine A, ketenimine B) and link them to deuterated species populations observed in mass spectrometry. B3LYP is the natural choice: systematic error cancellation when subtracting energies of constitutional isomers with the same atomic composition makes relative trends robust. The 6-311++G(d,p) basis provides triple-zeta flexibility for geometric differences (C≡N vs C=C=NH), polarization for electronic redistribution, and critical diffuse functions for anionic species generated to resolve discrepancies (without diffuse functions, relative energies of anions are deficient). The absence of a solvent model is not an oversight: MS operates in the gas phase, and the target correlation is between vacuum energies and vacuum fragmentation patterns. Including PCM would introduce an environment that does not exist at the time of measurement. When predictions disagree (ketenimine B form experimentally favored in FPIM but not as a neutral form), the analysis of anionic species—where diffuse functions prove their worth—resolves the discrepancy.', decision:'The coherence between the three decisions and the experimental observable is what makes the work successful. They do not seek absolute precision but relative trends (ΔG ~ 17–23 kcal/mol favoring the nitrile). This illustrates the inverse decision of the glyphosate case: just as vacuum can be qualitatively incorrect for a system in solution, a solvent model would be artificially incorrect for a gas-phase observable.', scale:'QUANTUM', solutionImgs:['imagenes_extraidas_metadatos/J_/img_p8_7.png','imagenes_extraidas_metadatos/J_/img_p9_8.png'] },

  { type:'problem', title:'What is the Real Atomic Structure of GOFs with DBA Linkers?', subtitle:'Three Models in Literature, None Reproduced d₀₀₁ ≈ 9.3 Å and Its Expansion Under Supercritical Gas', atlas:'Atlas #17', scale:'QUANTUM', problemImg:'imagenes_extraidas_metadatos/lombardi/img_p0_0.png' },
  { type:'solution', title:'DFT as the First Link: Parameterizing the Force Field, Not Predicting the Observable', method:'B3LYP / 6-31G(d) / Vacuum → CHARMM22 → MD with NAMD2 → Neutron Diffraction', finding:'Unlike the tautomer paper, here DFT does not directly produce the observable. What B3LYP/6-31G(d)/Gaussian09 does is parameterize CHARMM22: equilibrium geometries of DBA+coronene fragments, force constants for bonds/angles, dihedral parameters ("soft" degrees of freedom, k_χ ~ 2.5 kcal/mol for OBCC dihedrals), and Mulliken charges. Van der Waals (dispersion) parameters come from CGenFF—a transparent decision that bypasses B3LYP\'s main limitation without D3 corrections. The 6-31G(d) basis is sufficient because we seek local PES curvatures, not absolute energies; systematic errors cancel when taking second derivatives. No diffuse functions because all fragments are neutral. No solvent because the experiment is neutron diffraction with supercritical gases (methane, xenon). Of the four structural models tested, only the CA-GOF (linkers at quasi-random angles) simultaneously reproduces the d₀₀₁ spacing and its monotonic expansion with P—indirectly validating the DFT parameterization.', decision:'The three decisions are not made in the abstract but based on DFT\'s role in the workflow. When DFT is the first link in a multiscale chain, the basis set can be more modest (local parameters) and dispersion is handled by the empirical force field. Contrast this with the Garófalo case: there, DFT is the final method, the basis set must be large, and the three decisions directly impact the observable.', scale:'QUANTUM', solutionImgs:['imagenes_extraidas_metadatos/lombardi/img_p1_8.png','imagenes_extraidas_metadatos/lombardi/img_p3_10.png'] },

  { type:'text', title:'Limitation of the Quantum Level',
    body:'DFT describes <strong>isolated molecules</strong> or molecular pairs in vacuum. A reactor contains ≈10²³ molecules interacting simultaneously. We need to average over the configuration space.',
    insights:[
      { label:'The averaging problem', text:'The energy of a single configuration is not observable. Experiments measure thermodynamic values averaged over millions of configurations.' },
      { label:'Next level', text:'Statistical Thermodynamics provides the mathematical bridge between microscopic energy (DFT) and observable macroscopic properties.' }
    ], scale:'QUANTUM' },

  { type:'section', title:'Statistical Thermodynamics', subtitle:'From molecule to macroscopic observable', scale:'BRIDGE' },

      'All thermodynamic quantities derive from Z: free energy, entropy, pressure, heat capacity.',
      'The probability of finding the system in state i is P_i = e^{−βE_i}/Z.'
    ], scale:'BRIDGE',

  { type:'text', title:'Physical Intuition: From Energies to Probabilities',
    body:'Knowing the energy of one molecule is useless if the reactor holds a mole of them. <strong>Z transforms microscopic energies into probabilities</strong> of finding the system in each accessible state.',
    insights:[
      { label:'The ensemble', text:'We do not simulate a single trajectory: we sample configuration space according to Boltzmann statistical weights. The ensemble average is the observable.' },
      { label:'The isotherm', text:'The amount adsorbed at a given pressure is the ensemble average of the number of molecules in the pore. This is what GCMC directly calculates.' },
      { label:'The link to DFT', text:'Interaction energies calculated by DFT determine the weights e^{−βE}. The quality of the statistical sampling depends on the quality of those parameters.' }
    ], scale:'BRIDGE',
    svg:`<svg viewBox="0 0 300 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;border:1px solid #d0d7e0;border-radius:6px;background:#fff;">
  <text x="150" y="13" font-size="9" font-family="monospace" fill="#6e7a8a" text-anchor="middle" letter-spacing="1">CONFIGURATIONS → ENSEMBLE → OBSERVABLE</text>

  <text x="52" y="27" font-size="7" font-family="monospace" fill="#94a3b8" text-anchor="middle">configurations</text>

  // MC METHODOLOGY — Tres decisiones fundamentales
  { type:'section', title:'Monte Carlo Simulations: Three Fundamental Decisions', subtitle:'Statistical Ensemble · Boundary Conditions · Force Field', scale:'MONTE CARLO' },

  { type:'text', title:'First Decision: The Statistical Ensemble',
    body:'The choice of ensemble <strong>determines which thermodynamic magnitudes are accessible</strong> and which MC moves are admissible. It is not a formality—it is the physics of the problem.',
    insights:[
      { label:'NVT (Canonical)', text:'N, V, T fixed. Structural and energetic properties at fixed density. Only displacement/rotation moves. Natural starting point.' },
      { label:'NPT (Isothermal-Isobaric)', text:'Fixes pressure instead of volume. Additional volume-change moves. Standard for parameterizing force fields (OPLS, TraPPE) against experimental densities and enthalpies.' },
      { label:'μVT (Grand Canonical) & GEMC', text:'μVT: N fluctuates, ideal for adsorption. GEMC: two boxes with particle and volume exchange—calculates liquid-vapor coexistence diagrams without an explicit interface.' }
    ], scale:'MONTE CARLO' },

  { type:'table', title:'Statistical Ensembles: When to Use Each One', scale:'MONTE CARLO',
    headers:['Ensemble', 'Fixed / Fluctuates', 'Additional Moves', 'Main Application'],
    rows:[
      ['NVT', 'N, V, T / E', '— (Translation/Rotation only)', 'Structure, g(r), energies at fixed density'],
      ['NPT', 'N, P, T / V', 'Box volume change', 'Densities, H_vap, FF parameterization'],
      ['μVT (GCMC)', 'μ, V, T / N', 'Particle insertion and deletion', 'Adsorption isotherms, selectivity, Q_st'],
      ['GEMC', 'T, N_total / N₁,N₂,V₁,V₂', 'Particle exchange between boxes', 'Liquid-vapor coexistence diagrams']
    ]},

  { type:'problem', title:'Why GCMC for Adsorption? Chemical Potential as the Control Variable', subtitle:'Xe in ZIF-8 · C₂H₆/C₂H₄ in CNT · Ar/CH₄ in Exfoliated Graphite', atlas:'Atlas #1', scale:'MONTE CARLO' },
  { type:'solution', title:'The μVT Ensemble is Inescapable for Adsorption', method:'GCMC — Three systems, same logic', finding:'Experiment imposes gas pressure (→ μ) and measures adsorption: N fluctuates. In all three systems—Xe in ZIF-8, C₂H₆/C₂H₄ in nanotube bundles, Ar/CH₄ in graphite—GCMC is the natural ensemble. For binary mixtures, insertion/deletion moves operate independently for each species, yielding selectivity S = (θ₁/θ₂)/(p₁/p₂) directly. Isosteric heat Q_st = RT − {[⟨EₜN⟩−⟨Eₜ⟩⟨N⟩]/[⟨N²⟩−⟨N⟩²]} requires N to fluctuate—an expression intrinsic to the grand canonical ensemble.', decision:'If the physics of the problem imposes chemical potential (gas pressure), GCMC is the only correct choice. NVT would give the energy of a single configuration, not the observable isotherm.', scale:'MONTE CARLO', solutionImgs:['imagenes_extraidas_metadatos/1-s2_0-S000926141630104X-main/img_p2_3.png','imagenes_extraidas_metadatos/1-s2_0-S000926141630104X-main/img_p4_6.png'] },

  { type:'text', title:'Second Decision: Boundary Conditions',
    body:'We simulate finite systems (10²–10⁵ particles) aiming to represent a macroscopic system. <strong>Periodic Boundary Conditions (PBC)</strong> eliminate surface effects but introduce two technical considerations.',
    insights:[
      { label:'Minimum Image & Cut-off Radius', text:'Each particle interacts with the nearest image of others. Exact for LJ (r_c ≈ 2.5σ–5σ). Insufficient for Coulombic interactions (∝1/r): Ewald summation (PME) is mandatory.' },
      { label:'Box Size & Correlations', text:'The box must satisfy L > 2r_c. Phenomena with long correlation lengths (near phase transitions) require much larger boxes. In MOFs, the cell is an integer multiple of the crystal cell.' },
      { label:'Confined Systems', text:'PBC in directions parallel to the surface; walls (rigid or external potentials) in the perpendicular direction. Standard for slit or cylindrical nanopores.' }
    ], scale:'MONTE CARLO' },

  { type:'solution', title:'Three Confinement Geometries, Three PBC Strategies', method:'ZIF-8 · Carbon Nanotubes · Exfoliated Graphite', finding:'ZIF-8 (Xe): 3D PBC with 2×2×2 crystal cells (~34 Å per side). For Q_st, an elongated cell (34×34×85 Å) with PBC in X,Y and reflective plane in Z is used—the same paper requires two different PBC strategies for two different properties. CNT: Bundle of three nanotubes in a triangular arrangement; substrate geometry generates 4 site types (grooves, external surface, interior, interstices). Graphite: 2D PBC + semi-infinite flat substrate. The cleanest case: only complexity is energetic/entropic competition between the two species.', decision:'Boundary condition choice is not universal—it depends on the property being calculated. The same system may require different strategies for isotherms vs. isosteric heat.', scale:'MONTE CARLO', solutionImgs:['imagenes_extraidas_metadatos/CONICET_Digital_Nro.3aa22ec7-3999-4437-90f8-451b42595a1c_B/img_p18_3.png','imagenes_extraidas_metadatos/CONICET_Digital_Nro.af8fbc3f-3334-4b6e-a799-c71e50fb86a2_A/img_p6_7.png'] },

  { type:'text', title:'Third Decision: The Force Field',
    body:'The force field is our approximation of the PES V(R). <strong>Its choice determines the physics the simulation can—and cannot—capture</strong>. Result quality is limited by the weakest link in the chain.',
    insights:[
      { label:'TraPPE (Fluids & Phase Equilibria)', text:'Top-down philosophy: parameters adjusted against T_c and coexistence densities. United-atom (CH₃, CH₂ as pseudoatoms) reduces degrees of freedom. Intrinsic synergy with CBMC.' },
      { label:'UFF / DREIDING / ClayFF (Porous Materials)', text:'UFF covers the entire periodic table with rules based on atomic properties. Invaluable versatility for new materials, but limited thermodynamic accuracy (10–20% error). ClayFF treats metal-oxygen interactions as non-bonded.' },
      { label:'Polarizability: The Pending Problem', text:'All Class I FFs use fixed charges, ignoring the dynamic electron cloud response. Works well for non-polar adsorbates; fails at interfaces and ionic systems. Drude/AMOEBA: 2–10× more expensive.' }
    ], scale:'MONTE CARLO' },

  { type:'problem', title:'When Do Standard Force Fields Fail?', subtitle:'Xe in ZIF-8: Gate-Opening and the Mixed Force Field', atlas:'Atlas #22', scale:'MONTE CARLO' },
  { type:'solution', title:'The Mixed Force Field (MFF): Selective Family Mixing', method:'UFF* (σ) + Dreiding (ε) — Validated with CH₄ and Ar', finding:'For Xe in ZIF-8, UFF(+) reproduces the AP isotherm (pre gate-opening) but fails at HP (post gate-opening). UFF(*) has the inverse problem. Key observation: UFF(+) and UFF share the same large σ—not optimized for large adsorbates like Xe passing through ~3.4 Å windows. Solution: combine σ from UFF* (effective pore size) with ε from Dreiding (attractive well depth). The MFF reproduces both isotherms (AP and HP) and is validated with CH₄ at 125 K and Ar at 87 K with excellent agreement. For CNT: TraPPE-UA is the standard (CH₃ sp³: ε=98 K, σ=3.75 Å). For graphite: Single-center LJ (CH₄: ε=148.1 K, σ=3.81 Å) gives isosteric heats with error < 0.1%.', decision:'FFs are not interchangeable black boxes. When σ controls pore access (Xe in ZIF-8), standard parameters can fail qualitatively. Selective parameterization is legitimate but requires validation with independent data.', scale:'MONTE CARLO', solutionImgs:['imagenes_extraidas_metadatos/CONICET_Digital_Nro.af8fbc3f-3334-4b6e-a799-c71e50fb86a2_A/img_p5_6.png'] },

  // CG
  { type:'section', title:'Coarse-Grain: Spatial Scale', subtitle:'How do we simulate large-scale morphological systems?', scale:'COARSE-GRAIN' },
  { type:'glass', title:'Integration of Degrees of Freedom',
    eq:'\\[ V_{CG}(R) \\approx -k_B T \\ln \\int e^{-\\beta V} dr \\]',
    caption:'If you want to see a forest move, don\'t simulate the vibration of every leaf.',
    points:[
      'We group N atoms into a single CG "bead". The internal dynamics of the group are integrated out: only the effective interaction potential between beads remains.',
      'We gain 2-3 orders of magnitude in accessible time and space. We can simulate vesicles, micelles, polymer networks, and material assembly.',
      'The price: we lose active site detail. We cannot calculate chemical reactions or high-precision molecular recognition.'
    ], scale:'COARSE-GRAIN',
    image:'COARSE-GRAIN\nConcept: Top: detailed molecule, bottom: large connected spheres. Arrow: "integrating degrees of freedom"',
    svg:`<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;border:1px solid #d0d7e0;border-radius:6px;background:#fff;margin-top:0.5rem;">
  <text x="150" y="13" font-size="9" font-family="monospace" fill="#6e7a8a" text-anchor="middle" letter-spacing="1">ATOM → BEAD MAPPING (4:1)</text>
  <!-- TOP: explicit atoms (a polymer chain segment) -->
  <text x="150" y="28" font-size="7.5" font-family="monospace" fill="#3b4252" text-anchor="middle">all-atom representation</text>
  <!-- chain of 12 small atoms -->
  <g>

  { type:'text', title:'Gain vs Loss: When to Use CG',
    body:'We lose <strong>atomic active site detail</strong>, but gain orders of magnitude in temporal and spatial scale. The key is correctly identifying which questions require atomic resolution.',
    insights:[
      { label:'When to use CG', text:'Self-assembly morphology, bulk transport in materials, vesicle and micelle dynamics, conformations of long polymer chains.' },
      { label:'When to avoid CG', text:'Specific molecular recognition, selectivity calculations at active sites, chemical reactions, short-range interactions that determine affinity.' },
      { label:'Optimal protocol', text:'Use CG to identify relevant morphological configurations, then refine with explicit atoms in the regions of interest.' }
    ], scale:'COARSE-GRAIN' },

  { type:'problem', title:'What is the limit of simplified modeling under confinement?', subtitle:'Alkanes in carbon micropores: when reduction fails', atlas:'Atlas #15', scale:'COARSE-GRAIN' },
  { type:'solution', title:'The Coarse-Grain Limit', method:'4-to-1 CG vs explicit atom', finding:'The CG model faithfully reproduces alkane behavior in mesopores, but fails quantitatively in extreme confinements (pores < 1nm) where atomic detail dominates packing. The difference in isotherm can exceed 30%.', decision:'Use CG for bulk transport modeling and adsorption in mesopores. Switch to explicit atom representation when the pore is comparable to molecular size or when the specific active site determines the outcome.', scale:'COARSE-GRAIN', solutionImgs:['imagenes_extraidas_metadatos/hermosilla2019/img_p2_1.png','imagenes_extraidas_metadatos/hermosilla2019/img_p3_2.png'] },

  { type:'text', title:'The Common Thread: Selectivity as an Emergent Property',
    body:'In all three systems, selectivity emerges from the <strong>competition between energetic and entropic factors</strong>. At low coverage, energetics dominate; at high coverage, configurational entropy favors the smaller molecule.',
    insights:[
      { label:'Xe in ZIF-8', text:'Selectivity is not between two gases but between two regions of the material. The Q_st peak (~188 meV) at ~2000 μmol is an alternative thermodynamic signature to detect gate-opening.' },
      { label:'C₂H₆/C₂H₄ in Nanotubes', text:'S_ethane/ethylene ≈ 4 at 153 K in internal sites of large tubes. In narrow (7,7) tubes, there is no displacement: lower curvature → less dense phase → suppressed entropic effects.' },
      { label:'Ar/CH₄ in Graphite', text:'Selectivity drops upon completing the monolayer (~0.7 ML) and then rises. At low pressures: ideal mixture (IAST ≈ GCMC ≈ experiment). At high pressures: emergent non-ideality.' }
    ], scale:'MONTE CARLO' },
  { type:'problem', title:'How Does Linker Functionalization Modulate Selectivity Between C5 Isomers?', subtitle:'Separation of Pentane Isomers in UiO-66-H, -NH₂, -CH₃, -COOH · Separations 2025', atlas:'Atlas #22', scale:'MONTE CARLO', problemImg:'imagenes_extraidas_metadatos/separations-12-00152/img_p2_0.png' },
  { type:'solution', title:'Direct GCMC of Mixtures: IAST Overestimates Selectivity in MOFs with Site Heterogeneity', method:'GCMC (μVT) · DREIDING+UFF(Zr) framework · TraPPE-UA adsorbates · 2×2×2 cells, r_c = 12 Å', finding:'UiO-66-NH₂ emerges as the most selective material: geometric complementarity between quasi-spherical neopentane (central C pseudoatom: σ=6.40 Å, ε/k_B=0.5 K; four peripheral CH₃) and tetrahedral cavities (~7.5 Å). Affinity hierarchy in UiO-66-NH₂: neoP >> iP > nP (b₁: 819.9 vs. 85.5 vs. 4.51). Q_st,0 reveals sequential filling: tetrahedral cavities (high affinity, ~71–80 kJ/mol) → octahedral cavities (~12 Å). Explicit treatment of n-pentane conformers (tt: 40%, tg: 53%, gg: 7%) is necessary because conformational flexibility affects packing. IAST and the Dual Process Langmuir model systematically overestimate selectivity—GCMC ternary mixtures show significant n-pentane co-adsorption that these models predict as nearly zero. UiO-66 site heterogeneity breaks mixture ideality even at moderate pressures, unlike Ar-CH₄ in graphite where IAST was quantitatively correct at low pressures.', decision:'When the adsorbent has pronounced site heterogeneity (cavities of different size and affinity), direct GCMC simulations of mixtures are indispensable. IAST fails where it matters most: it predicts a much easier separation than it actually is. The -NH₂ functionalization is the design tool; the GCMC/IAST cross-validation exposes the limits of the ideal approximation.', scale:'MONTE CARLO', solutionImgs:['imagenes_extraidas_metadatos/separations-12-00152/img_p8_4.png','imagenes_extraidas_metadatos/separations-12-00152/img_p9_5.png'] },

  { type:'text', title:'The Complete Hierarchy: Electrons → Force Field → Sampling',
    body:'The three decisions form a <strong>coupled chain</strong>. Result quality is limited by the weakest link—not the most sophisticated one.',
    insights:[
      { label:'Incorrect Force Field (ZIF-8)', text:'The wrong FF produces qualitatively incorrect results—it fails to capture the load increase at gate-opening—regardless of GCMC sampling quality.' },
      { label:'Incomplete Substrate Model (CNT)', text:'Homogeneous bundles yield isosteric heats that do not match experiments at low coverage, even if TraPPE is correct. The heterogeneous substrate was the weak link.' },
      { label:'Simple System, Exact Result (Graphite)', text:'Spherical adsorbates + flat substrate: single-center LJ + IAST + GCMC yield quantitative results. Model complexity must be proportional to system complexity.' }
    ], scale:'MONTE CARLO' },

  { type:'section', title:'Molecular Dynamics: Time', subtitle:'How do molecules move and diffuse?', scale:'DYNAMICS' },
  { type:'glass', title:'Newton\'s Second Law',
    eq:'\\[ m_i \\frac{d^2 \\mathbf{r}_i}{dt^2} = -\\nabla_i V \\]',
    caption:'The quantum potential is replaced by classical force fields: springs, charges, Lennard-Jones terms.',
    points:[
      'We integrate the equations of motion step by step (femtosecond time steps). Each atom follows the instantaneous force from its neighbors.',
      'Force fields (CHARMM, AMBER, OPLS) parameterize the potential V(r) from quantum and experimental data.',
      'The result: full trajectories, diffusion coefficients, radial distribution functions, vibrational spectra.'
    ], scale:'DYNAMICS',
    image:'MOLECULAR DYNAMICS\nConcept: Molecules with tails showing their trajectory, on an energy surface background.' },
  { type:'text', title:'The Temporal Limit: The Microsecond Barrier',
    body:'We integrate step by step at <strong>femtosecond (10⁻¹⁵ s) intervals</strong>. We can see diffusion and collisions, but we are blind to slow processes like protein folding or phase rearrangements.',
    insights:[
      { label:'The time window', text:'Typical MD simulations reach microseconds on specialized hardware. Biologically relevant processes occur on millisecond timescales or longer.' },
      { label:'What we see', text:'Diffusion of small molecules, polymer flexibility, protein conformations, structural relaxation of porous materials.' },
      { label:'Transition to CG', text:'When we need to scale to micrometers or milliseconds, the representation must be simplified: this is where Coarse-Graining emerges.' }
    ], scale:'DYNAMICS',

  { type:'solution', title:'Charge Regulation by Local pH', method:'Mean-field Molecular Theory', finding:'The local pH inside the polymer gel differs from the bulk solution pH due to the polymer charge distribution. Theory predicts an optimal pH window where the effective charge of glyphosate and the polymer charge maximize their electrostatic attraction.', decision:'Adjust the polymer grafting density to create an optimal internal pH microenvironment, regardless of the external pH of the solution being treated.', scale:'MOLECULAR THEORY', solutionImgs:['imagenes_extraidas_metadatos/2019_Perez_A/img_p3_2.png','imagenes_extraidas_metadatos/2019_Perez_A/img_p4_4.png'] },

function imgPlaceholder(img, svg) {
  if (svg) return `<div style="margin-top:1rem;">${svg}</div>`;
  if (!img) return '';
  const lines = img.split('\n');
  const title = lines[0] || '';
  const desc = lines.slice(1).join(' ');
  return `<div class="img-placeholder"><div class="img-title">${title}</div><p class="img-desc">${desc}</p></div>`;
}

  const sec = document.createElement('section');
  sec.className = 'slide';
  const levelKey = (s.scale || '').replace('NIVEL ', '').split(' ')[0];

  let headerLeft = `<span class="level-tag">${s.scale || ''}</span>`;

  const header = `<header class="slide-header">${headerLeft}<div class="header-right">${headerRight}</div></header>`;
  const footer = `<footer class="slide-footer">
    <span class="attribution">Albesa · INIFTA-CONICET-UNLP</span>
    <div class="progress-track"><div class="progress-fill" id="fill-${idx}" style="width:${((idx+1)/slideData.length)*100}%"></div></div>
    <span class="slide-num">${String(idx+1).padStart(2,'0')} / ${slideData.length}</span>

  let body = '';

  if (s.type === 'title') {

    const rowsHTML = rows.map(r => `<tr>
      <td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td>
    </tr>`).join('');
    body = `<div class="slide-body" style="justify-content:flex-start;padding-top:2rem;">
      <div class="table-wrap">
        <h3>${s.title}</h3>
        <table class="methods-table">
          <thead><tr><th>${headers[0]}</th><th>${headers[1]}</th><th>${headers[2]}</th><th>${headers[3]}</th></tr></thead>
          <tbody>${rowsHTML}</tbody>
        </table>
      </div>
    </div>`;


  } else if (s.type === 'final') {
    body = `<div class="slide-body final-wrap">
      <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${stripeColor};"></div>
      <h1>${s.title}</h1>
      <div class="title-rule"></div>
      <p class="contact">${s.contact}</p>
    </div>`;
  }

  sec.innerHTML = header + body + footer;
  return sec;
}

function render() {
  deck.innerHTML = '';
  slideData.forEach((s, i) => deck.appendChild(buildSlide(s, i)));
  go(0);
}

function go(n) {
  current = Math.max(0, Math.min(slideData.length - 1, n));
  deck.style.transform = `translateX(-${current * 100}vw)`;
  prevBtn.style.opacity = current === 0 ? '0.3' : '1';
  nextBtn.style.opacity = current === slideData.length - 1 ? '0.3' : '1';
  if (window.MathJax) MathJax.typesetPromise();
}

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') go(current + 1);
  if (e.key === 'ArrowLeft') go(current - 1);
});
prevBtn.addEventListener('click', () => go(current - 1));
nextBtn.addEventListener('click', () => go(current + 1));

render();
</script>
</body>
</html>
