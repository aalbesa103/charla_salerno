<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Multiscale Integration — Alberto Albesa</title>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d1117;
  --ink2: #3b4252;
  --ink3: #6e7a8a;
  --rule: #d0d7e0;
  --rule2: #e8ecf0;
  --bg: #f7f5f0;
  --bg2: #ffffff;
  --quantum: #1a3a5c;
  --quantum-light: #e8f0f8;
  --mc: #1a4a2e;
  --mc-light: #e8f4ec;
  --md: #3a1a4a;
  --md-light: #f0e8f8;
  --cg: #4a2a1a;
  --cg-light: #f8f0e8;
  --theory: #1a3a4a;
  --theory-light: #e8f4f8;
  --pnp: #3a2a1a;
  --pnp-light: #f8f4e8;
  --accent: #c8a96e;
  --problem: #8b2020;
  --solution: #1a4a2e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  /* ~15px en 768px (notebook 15"), 16px en pantallas más grandes */
  font-size: clamp(14px, 2vh, 16px);
}

body {
  overflow: hidden;
  background: var(--bg);
  font-family: 'Space Grotesk', sans-serif;
  color: var(--ink);
  height: 100vh;
}

/* ── Deck ── */
.deck {
  display: flex;
  height: 100vh;
  transition: transform 0.55s cubic-bezier(0.77, 0, 0.175, 1);
}

.slide {
  width: 100vw;
  height: 100vh;
  flex-shrink: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}

/* ── Header bar ── */
.slide-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 3rem;
  border-bottom: 1px solid var(--rule);
  background: var(--bg2);
  z-index: 10;
}

.slide-header .level-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink3);
  border: 1px solid var(--rule);
  padding: 0.3rem 0.75rem;
  border-radius: 2rem;
}

.slide-header .atlas-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 0.3rem 0.75rem;
  border-radius: 2rem;
}

.slide-header .header-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

/* ── Footer bar ── */
.slide-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.5rem 3rem;
  border-top: 1px solid var(--rule);
  background: var(--bg2);
}

.slide-footer .attribution {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--ink3);
  letter-spacing: 0.08em;
}

.progress-track {
  flex: 1;
  max-width: 160px;
  height: 2px;
  background: var(--rule2);
  border-radius: 1px;
  overflow: hidden;
  margin: 0 1.5rem;
}

.progress-fill {
  height: 100%;
  background: var(--ink2);
  border-radius: 1px;
  transition: width 0.3s;
}

.slide-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--ink3);
}

/* ── Content area ── */
.slide-body {
  padding: 1.25rem 3rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--rule) transparent;
}

/* ── Type: title ── */
.slide-title-wrap {
  max-width: 780px;
}

.slide-title-wrap .eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 1.25rem;
}

.slide-title-wrap h1 {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 5rem;
  font-weight: 400;
  line-height: 1.08;
  color: var(--ink);
  margin-bottom: 1.5rem;
}

.slide-title-wrap .sub {
  font-size: 1.35rem;
  color: var(--ink2);
  font-weight: 300;
  line-height: 1.6;
  max-width: 520px;
}

.title-rule {
  width: 3rem;
  height: 2px;
  background: var(--accent);
  margin: 1.75rem 0;
}

/* ── Type: section ── */
.section-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 100%;
}

.section-wrap .level-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 1rem;
}

.section-wrap h2 {
  font-family: 'EB Garamond', serif;
  font-size: 4rem;
  font-weight: 400;
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: 0.75rem;
}

.section-wrap .section-q {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 1.75rem;
  color: var(--ink2);
}

/* ── Type: text (theoretical) ── */
.text-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  align-items: start;
}

.text-wrap.single {
  grid-template-columns: 1fr;
  max-width: 680px;
}

.text-left h3 {
  font-family: 'EB Garamond', serif;
  font-size: 2.9rem;
  font-weight: 400;
  line-height: 1.15;
  margin-bottom: 1.25rem;
  color: var(--ink);
}

.text-left .body-text {
  font-size: 1.2rem;
  line-height: 1.7;
  color: var(--ink2);
  font-weight: 300;
}

.text-left .body-text strong {
  font-weight: 500;
  color: var(--ink);
}

.text-right {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* Key insight box */
.insight-box {
  border-left: 3px solid var(--accent);
  padding: 1rem 1.25rem;
  background: var(--bg2);
  border-radius: 0 6px 6px 0;
}

.insight-box .insight-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 0.4rem;
}

.insight-box p {
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--ink2);
}

/* Level badge for text slides */
.level-stripe {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
}

/* ── Type: glass (equation) ── */
.eq-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  align-items: center;
}

.eq-left h3 {
  font-family: 'EB Garamond', serif;
  font-size: 2.7rem;
  font-weight: 400;
  margin-bottom: 1.5rem;
  color: var(--ink);
}

.eq-box {
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 2rem;
  font-size: 2rem;
  text-align: center;
  min-height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.eq-caption {
  margin-top: 1rem;
  font-size: 1.05rem;
  color: var(--ink3);
  line-height: 1.6;
  font-style: italic;
}

.eq-right {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.eq-point {
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  padding: 0.75rem 1rem;
  background: var(--bg2);
  border: 1px solid var(--rule2);
  border-radius: 6px;
}

.eq-point .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 0.45rem;
  flex-shrink: 0;
}

.eq-point p {
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--ink2);
}

/* ── Type: problem ── */
.problem-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.5rem;
  max-width: 680px;
}

.problem-eyebrow {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.problem-badge {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #8b2020;
  border: 1px solid #8b2020;
  padding: 0.25rem 0.65rem;
  border-radius: 2rem;
}

.problem-wrap h3, .problem-wrap-with-img h3 {
  font-family: 'EB Garamond', serif;
  font-size: 3.4rem;
  font-weight: 400;
  line-height: 1.1;
  color: var(--ink);
}

.problem-context {
  font-size: 1.15rem;
  color: var(--ink2);
  font-weight: 300;
  padding: 1rem 1.25rem;
  border-left: 3px solid #d4a0a0;
  background: #fdf5f5;
  border-radius: 0 6px 6px 0;
}

/* ── Type: solution ── */
.solution-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  align-items: start;
}

.solution-left h3 {
  font-family: 'EB Garamond', serif;
  font-size: 2.7rem;
  font-weight: 400;
  line-height: 1.15;
  color: var(--ink);
  margin-bottom: 0.5rem;
}

.solution-left .method-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--ink3);
  margin-bottom: 1.25rem;
  display: block;
}

.solution-left .finding {
  font-size: 1.15rem;
  line-height: 1.7;
  color: var(--ink2);
  font-weight: 300;
}

.decision-card {
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 1.5rem;
  border-top: 3px solid var(--solution);
}

.decision-card .dec-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--solution);
  margin-bottom: 0.75rem;
}

.decision-card .dec-text {
  font-size: 1.25rem;
  line-height: 1.65;
  color: var(--ink);
  font-weight: 400;
}

/* ── Type: table ── */
.table-wrap h3 {
  font-family: 'EB Garamond', serif;
  font-size: 2.5rem;
  font-weight: 400;
  margin-bottom: 1.5rem;
  color: var(--ink);
}

.methods-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 1rem;
}

.methods-table thead th {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink3);
  text-align: left;
  padding: 0.5rem 0.75rem;
  border-bottom: 2px solid var(--rule);
}

.methods-table tbody td {
  padding: 0.65rem 0.75rem;
  border-bottom: 1px solid var(--rule2);
  color: var(--ink2);
  vertical-align: top;
  line-height: 1.5;
}

.methods-table tbody td:first-child {
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
}

.methods-table tbody td:nth-child(2) {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--ink3);
}

.methods-table tbody tr:last-child td {
  border-bottom: none;
}

.methods-table tbody tr:hover td {
  background: var(--bg2);
}

/* ── Type: final ── */
.final-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  height: 100%;
  max-width: 700px;
}

.final-wrap h1 {
  font-family: 'EB Garamond', serif;
  font-size: 4.4rem;
  font-weight: 400;
  font-style: italic;
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: 2rem;
}

.final-wrap .contact {
  font-family: 'DM Mono', monospace;
  font-size: 0.85rem;
  color: var(--ink3);
  letter-spacing: 0.05em;
}

/* ── Level color map ── */
.level-FOUNDATION   { background: #94a3b8; }
.level-QUANTUM      { background: var(--quantum); }
.level-BRIDGE       { background: #64748b; }
.level-MC           { background: var(--mc); }
.level-DYNAMICS     { background: var(--md); }
.level-COARSE       { background: var(--cg); }
.level-THEORY       { background: var(--theory); }
.level-CONTINUUM    { background: var(--pnp); }
.level-CLOSING      { background: var(--accent); }

/* bg tint for section slides (optional) */
.section-tint-QUANTUM   { background: #f0f4f8; }
.section-tint-MC        { background: #f0f7f3; }
.section-tint-DYNAMICS  { background: #f5f0f8; }
.section-tint-COARSE    { background: #f8f3f0; }
.section-tint-THEORY    { background: #f0f6f8; }
.section-tint-CONTINUUM { background: #f8f5f0; }

/* ── Nav arrows ── */
.nav-btn {
  position: fixed;
  bottom: 50px;
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  transition: background 0.15s, border-color 0.15s;
  color: var(--ink2);
  font-size: 1rem;
}

.nav-btn:hover { background: var(--ink); color: white; border-color: var(--ink); }
.nav-btn.prev { left: calc(50% - 52px); }
.nav-btn.next { right: calc(50% - 52px); }

/* image placeholder */
.img-placeholder {
  border: 1.5px dashed var(--rule);
  border-radius: 6px;
  padding: 1.5rem;
  text-align: center;
  background: var(--bg2);
}

.img-placeholder .img-title {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 0.5rem;
}

.img-placeholder .img-desc {
  font-size: 0.8rem;
  color: var(--ink3);
  font-style: italic;
  line-height: 1.5;
}

/* ── Paper images in cases ── */
.problem-wrap-with-img {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2.5rem;
  align-items: center;
  max-width: none;
}

.problem-wrap-with-img .problem-text {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  max-width: 580px;
}

.paper-img-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}

.paper-img {
  max-width: 100%;
  max-height: 340px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--rule);
  background: white;
}

.paper-img-caption {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--ink3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.solution-images {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 1rem;
}

.solution-images img {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--rule);
  background: white;
}

.solution-wrap-3col {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1.5rem;
  align-items: start;
}
</style>
</head>

<div class="deck" id="deck"></div>

{ type:'text', title:'Focus of the Session', body:'The seminar will focus on two critical nodes of this hierarchy: <strong>rigor in parameter acquisition (DFT)</strong> and <strong>depth in equilibrium sampling (Monte Carlo)</strong>.', insights:[{label:'DFT Rigor', text:'Ensuring the foundational parameters (geometries, charges, interaction energies) are physically correct before feeding them into statistical models.'}, {label:'Monte Carlo Depth', text:'Understanding how the grand canonical ensemble perfectly maps to the experimental reality of adsorption.'}], scale:'FOUNDATION' },

{ type:'section', title:'Quantum Level: DFT', subtitle:'The Parameter Factory', scale:'QUANTUM' },

{ type:'text', title:'Fundamentals of DFT', body:'DFT shifts the focus from the intractable 3N-dimensional wavefunction to the 3-dimensional <strong>electron density ρ(r)</strong>.', insights:[{label:'Hohenberg-Kohn Theorems', text:'The ground-state energy is a unique functional of ρ(r). The density contains all necessary information to determine the system properties.'}, {label:'Kohn-Sham Formalism', text:'Introduces a fictitious system of non-interacting electrons to calculate kinetic energy exactly. All unknown physics are grouped into the Exchange-Correlation functional (E_XC).'}, {label:'The Challenge', text:'The exact form of E_XC is unknown. Approximating it correctly is the central problem of DFT.'}], scale:'QUANTUM', svg:`<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;border:1px solid #d0d7e0;border-radius:6px;background:#fff;">

  <circle cx="55" cy="70" r="18" fill="#8b2020" fill-opacity="0.08" stroke="#8b2020" stroke-width="0.8" stroke-dasharray="3,2"/>

{ type:'text', title:'Exchange and Correlation: What E_XC Contains', body:'E_XC absorbs two physically distinct effects plus the correction for an artificial error introduced by the formalism itself. Understanding each component explains why approximate functionals succeed or fail.', insights:[{ label:'Exchange (E_X)', text:'Arises from the Pauli exclusion principle: two electrons with the same spin avoid each other — the Fermi hole. This avoidance lowers the energy relative to the classical Coulomb repulsion. In Hartree-Fock, E_X is calculated exactly. In DFT it is approximated as a functional of ρ(r).' }, { label:'Correlation (E_C)', text:'Electrons with opposite spin also avoid each other due to Coulomb repulsion — the Coulomb hole. DFT captures dynamic correlation (instantaneous avoidance) reasonably well but fails for static correlation, which appears in systems with near-degenerate electronic configurations (open-shell transition metals, bond-breaking).' }, { label:'Self-interaction error (SIE)', text:'The classical term J[ρ] includes the spurious interaction of each electron with itself. In Hartree-Fock this cancels exactly with E_X. In DFT with approximate functionals the cancellation is imperfect, leaving a residual SIE that causes electron over-delocalization and systematic underestimation of reaction barriers.' }], scale:'QUANTUM' },

{ type:'table', title:'Jacob\'s Ladder: Hierarchy of Density Functional Approximations', scale:'QUANTUM', headers:['Rung', 'Functional class', 'Ingredients', 'Examples', 'Key limitation'], rows:[['1', 'LDA', 'ρ(r) only', 'SVWN', 'Overbinds. No dispersion. SIE severe.'],['2', 'GGA', 'ρ(r) + ∇ρ(r)', 'PBE, BLYP, BP86', 'No long-range dispersion. SIE persists.'],['3', 'meta-GGA', 'ρ, ∇ρ, τ(r)', 'TPSS, r²SCAN, M06-L', 'SIE reduced. Dispersion still absent.'],['4', 'Hybrid / RSH', '+ fraction of exact exchange', 'B3LYP, PBE0, ωB97X-V', 'N⁴ scaling. RSH mitigates SIE better.'],['5', 'Double-hybrid', '+ MP2 correlation', 'PWPB95-D4, ωB97M(2)', 'N⁵ scaling. Large basis sets required.']] },

{ type:'section', title:'Fundamental Considerations in a DFT Calculation', subtitle:'Functional · Basis Sets · Solvent Model', scale:'QUANTUM' },

{ type:'text', title:'Physical Failure 1: Self-Interaction Error (SIE)', body:'In approximate functionals, an electron unphysically interacts with its own charge density. This is the <strong>Self-Interaction Error (SIE)</strong>.', insights:[{label:'The Consequence', text:'Electrons repel themselves, leading to artificial delocalization. Orbitals become too diffuse.'}, {label:'Chemical Impact', text:'SIE systematically underestimates reaction barrier heights and over-stabilizes delocalized transition states.'}, {label:'The Solution', text:'Hybrid functionals incorporate exact Hartree-Fock exchange, which perfectly cancels the self-interaction term for a single electron. Range-separated hybrids (like ωB97X-V) do this optimally at both short and long ranges.'}], scale:'QUANTUM' },

{ type:'text', title:'Physical Failure 2: Dispersion Forces (London)', body:'Standard DFT functionals (LDA, GGA, and most hybrids) do not capture long-range electron correlation. They are fundamentally <strong>blind to van der Waals forces</strong>.', insights:[{label:'The Consequence', text:'Without dispersion, purely non-covalent interactions (like stacking or physical adsorption) often show no binding energy at all. The molecules simply fly apart.'}, {label:'The Solution', text:'Empirical dispersion corrections (D3 or D4) must be added. They introduce pairwise atom-atom potentials parameterized to match high-level wavefunction theory. Using DFT without dispersion for adsorption is physically meaningless.'}], scale:'QUANTUM' },

{ type:'text', title:'The 3 Coupled Decisions in DFT', body:'A DFT calculation requires three simultaneous, interdependent choices. Changing one without adjusting the others breaks the consistency.', insights:[{label:'1. The Functional (E_XC)', text:'Determines the physics (e.g., ωB97M-V for general thermochemistry, PBEh-3c for fast geometries). Dispersion corrections are mandatory.'}, {label:'2. The Basis Set', text:'The mathematical functions describing the orbitals. Must be large enough (TZVP) and include diffuse functions for anions or weak interactions.'}, {label:'3. The Solvent Model', text:'Continuum models (SMD) modify the Hamiltonian self-consistently. Vacuum calculations can yield qualitatively incorrect chemistry.'}], scale:'QUANTUM' },

{ type:'problem', title:'Glyphosate Case: The Controversy', subtitle:'What is the Predominant Species of Glyphosate in Solution?', atlas:'Atlas #3', scale:'QUANTUM' },

{ type:'solution', title:'Glyphosate Case: Resolution through Rigor', method:'B3LYP / 6-311++G(2d,2p) / SMD', finding:'Previous calculations in vacuum predicted a neutral, uncharged species. However, NMR and XPS experiments indicate a zwitterion. The discrepancy was purely methodological.', decision:'The SMD solvent model and diffuse functions (++) are strictly necessary to stabilize the separated charges. When applied, DFT correctly predicts the zwitterion as the most stable species, perfectly matching experiment.', scale:'QUANTUM', solutionImgs:['imagenes_extraidas_metadatos/1-s2_0-S2667022422000780-main__1_/img_p2_3.png','imagenes_extraidas_metadatos/1-s2_0-S2667022422000780-main__1_/img_p3_6.png'] },

{ type:'text', title:'Limitation of the Quantum Level', body:'DFT provides the exact energy of a <strong>single static configuration</strong>. However, a macroscopic reactor requires averaging over millions of configurations at finite temperature.', insights:[{label:'The Average Problem', text:'At room temperature, the system explores a vast energy landscape. A single optimized minimum is insufficient to describe thermodynamic observables.'}, {label:'The Missing Link', text:'We need a theoretical framework to bridge the gap between deterministic quantum energies and probabilistic macroscopic behavior.'}], scale:'BRIDGE' },

{ type:'glass', title:'The Partition Function (Z)', eq:'\\[ Z = \\sum_i e^{-\\beta E_i} \\]', caption:'The Boltzmann weight connects molecular energies (from DFT) to macroscopic probabilities.', points:['The Average Problem: A single optimized structure does not represent 10²³ molecules at finite temperature. We must average over configurations.', 'Z sums the Boltzmann weight over every accessible microstate. All macroscopic properties are mathematical derivatives of ln Z.', 'F = −k_B T ln Z. The system minimizes Free Energy (F), which balances energy and entropy.'], scale:'BRIDGE', svg:`<svg viewBox="0 0 300 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;border:1px solid #d0d7e0;border-radius:6px;background:#fff;">
  <text x="150" y="13" font-size="9" font-family="monospace" fill="#6e7a8a" text-anchor="middle" letter-spacing="1">Z AS THE GENERATOR OF THERMODYNAMICS</text>
  <rect x="114" y="22" width="72" height="22" rx="3" fill="#f7f5f0" stroke="#c8a96e" stroke-width="1.5"/>
  <text x="150" y="37" font-size="9" font-family="monospace" fill="#8b6a20" text-anchor="middle" font-weight="bold">ln Z</text>
  <line x1="150" y1="44" x2="60" y2="68" stroke="#d0d7e0" stroke-width="1.2"/>
  <line x1="150" y1="44" x2="150" y2="68" stroke="#d0d7e0" stroke-width="1.2"/>
  <line x1="150" y1="44" x2="240" y2="68" stroke="#d0d7e0" stroke-width="1.2"/>
  <rect x="18" y="68" width="84" height="20" rx="3" fill="#e8f0f8" stroke="#1a3a5c" stroke-width="1"/>
  <text x="60" y="82" font-size="7.5" font-family="monospace" fill="#1a3a5c" text-anchor="middle">⟨E⟩ = −∂lnZ/∂β</text>
  <rect x="108" y="68" width="84" height="20" rx="3" fill="#e8f4ec" stroke="#1a4a2e" stroke-width="1"/>
  <text x="150" y="82" font-size="7.5" font-family="monospace" fill="#1a4a2e" text-anchor="middle">F = −k_BT lnZ</text>
  <rect x="198" y="68" width="84" height="20" rx="3" fill="#f8f4e8" stroke="#3a2a1a" stroke-width="1"/>
  <text x="240" y="82" font-size="7.5" font-family="monospace" fill="#3a2a1a" text-anchor="middle">S = k_B(lnZ+β⟨E⟩)</text>
  <line x1="150" y1="88" x2="150" y2="108" stroke="#d0d7e0" stroke-width="1.2"/>
  <rect x="90" y="108" width="120" height="18" rx="3" fill="#f7f5f0" stroke="#d0d7e0" stroke-width="1"/>
  <text x="150" y="120" font-size="7.5" font-family="monospace" fill="#6e7a8a" text-anchor="middle">μ, p, Cp, χ, κ, ...</text>
</svg>` },

{ type:'text', title:'Statistical Ensembles', body:'The ensemble defines the physical constraints of the system. It dictates <strong>which variables are fixed and which fluctuate</strong>.', insights:[{label:'NVT (Canonical Ensemble)', text:'Fixed: Number of particles (N), Volume (V), Temperature (T). Energy fluctuates. Useful for closed systems with fixed density.'}, {label:'μVT (Grand Canonical Ensemble)', text:'Fixed: Chemical Potential (μ), Volume (V), Temperature (T). Both energy and particle number (N) fluctuate. The system exchanges particles with a reservoir.'}], scale:'BRIDGE' },

{ type:'glass', title:'The Natural Ensemble for Adsorption', eq:'\\[ \\Xi = \\sum_{N=0}^{\\infty}\\sum_i e^{-\\beta(E_i - \\mu N)} \\]', caption:'The Grand Canonical partition function (Ξ) perfectly maps to the experimental reality of adsorption.', points:['The experiment imposes gas pressure. In thermodynamics, fixing pressure fixes the chemical potential (μ).', 'The experiment measures the amount adsorbed. In the simulation, N must be a fluctuating output, not a fixed input.', 'Therefore, the μVT ensemble is inescapable for predicting adsorption isotherms. NVT would give the energy of a single configuration, not the observable isotherm.'], scale:'BRIDGE', svg:`<svg viewBox="0 0 300 148" xmlns="http://www.w3.org/2000/svg" style="width:100%;border:1px solid #d0d7e0;border-radius:6px;background:#fff;">
  <text x="150" y="13" font-size="9" font-family="monospace" fill="#6e7a8a" text-anchor="middle" letter-spacing="1">CANONICAL vs GRAND CANONICAL</text>
  <line x1="150" y1="18" x2="150" y2="140" stroke="#e8ecf0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="75" y="30" font-size="8" font-family="monospace" fill="#1a3a5c" text-anchor="middle">Canonical (NVT)</text>
  <rect x="18" y="36" width="114" height="60" rx="4" fill="#e8f0f8" stroke="#1a3a5c" stroke-width="1"/>
  <circle cx="48" cy="58" r="5" fill="#1a3a5c" opacity="0.6"/>
  <circle cx="68" cy="50" r="5" fill="#1a3a5c" opacity="0.6"/>
  <circle cx="90" cy="62" r="5" fill="#1a3a5c" opacity="0.6"/>
  <circle cx="58" cy="76" r="5" fill="#1a3a5c" opacity="0.6"/>
  <circle cx="108" cy="54" r="5" fill="#1a3a5c" opacity="0.6"/>
  <text x="75" y="110" font-size="7" font-family="monospace" fill="#1a3a5c" text-anchor="middle">N fixed · E fluctuates</text>
  <text x="75" y="120" font-size="7" font-family="monospace" fill="#1a3a5c" text-anchor="middle">F = −k_BT ln Z</text>
  <text x="75" y="132" font-size="7" font-family="monospace" fill="#94a3b8" text-anchor="middle">→ ⟨E⟩, S, p, Cp</text>
  <text x="225" y="30" font-size="8" font-family="monospace" fill="#1a4a2e" text-anchor="middle">Grand Canonical (μVT)</text>
  <rect x="168" y="36" width="114" height="60" rx="4" fill="#e8f4ec" stroke="#1a4a2e" stroke-width="1"/>
  <circle cx="192" cy="56" r="5" fill="#1a4a2e" opacity="0.6"/>
  <circle cx="214" cy="66" r="5" fill="#1a4a2e" opacity="0.6"/>
  <circle cx="236" cy="50" r="5" fill="#1a4a2e" opacity="0.6"/>
  <circle cx="258" cy="62" r="5" fill="#1a4a2e" opacity="0.6"/>
  <circle cx="202" cy="78" r="5" fill="#1a4a2e" opacity="0.3" stroke="#1a4a2e" stroke-width="1" stroke-dasharray="2,1"/>
  <circle cx="248" cy="74" r="5" fill="#1a4a2e" opacity="0.3" stroke="#1a4a2e" stroke-width="1" stroke-dasharray="2,1"/>
  <text x="225" y="110" font-size="7" font-family="monospace" fill="#1a4a2e" text-anchor="middle">N and E fluctuate</text>
  <text x="225" y="120" font-size="7" font-family="monospace" fill="#1a4a2e" text-anchor="middle">Ω = −k_BT ln Ξ</text>
  <text x="225" y="132" font-size="7" font-family="monospace" fill="#94a3b8" text-anchor="middle">→ ⟨N⟩, isotherm, selectivity</text>
</svg>` },

{ type:'section', title:'Monte Carlo: Adsorption', subtitle:'How much fits and with what selectivity?', scale:'MONTE CARLO' },

{ type:'glass', title:'The Metropolis Algorithm', eq:'\\[ P_{\\mathrm{acc}} = \\min\\!\\left(1,\\, e^{-\\beta \\Delta E}\\right) \\]', caption:'Stochastic sampling rather than exhaustive integration. We walk through the most probable regions of phase space without ever calculating Z directly.', points:['A random move is proposed. If energy goes down (ΔE ≤ 0), it is always accepted.', 'If energy goes up (ΔE > 0), it is accepted with probability e^{−βΔE} depending on temperature.', 'This simple rule guarantees that the Markov chain samples the correct Boltzmann distribution.'], scale:'MONTE CARLO', svg:`<svg viewBox="0 0 300 165" xmlns="http://www.w3.org/2000/svg" style="width:100%;border:1px solid #d0d7e0;border-radius:6px;background:#fff;">
  <text x="150" y="13" font-size="9" font-family="monospace" fill="#6e7a8a" text-anchor="middle" letter-spacing="1">METROPOLIS DECISION CYCLE</text>

  <rect x="95" y="58" width="110" height="22" rx="3" fill="#f7f5f0" stroke="#3b4252" stroke-width="1.2"/>
  <text x="150" y="73" font-size="8" font-family="monospace" fill="#3b4252" text-anchor="middle">compute ΔE</text>
  <line x1="150" y1="80" x2="150" y2="96" stroke="#3b4252" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="108" y="96" width="84" height="22" rx="3" fill="#f7f5f0" stroke="#c8a96e" stroke-width="1.5"/>
  <text x="150" y="111" font-size="8" font-family="monospace" fill="#8b6a20" text-anchor="middle">ΔE ≤ 0 ?</text>

  <text x="78" y="103" font-size="7" font-family="monospace" fill="#1a4a2e" text-anchor="middle">yes</text>
  <rect x="8" y="96" width="40" height="22" rx="3" fill="#e8f4ec" stroke="#1a4a2e" stroke-width="1.2"/>
  <text x="28" y="111" font-size="8" font-family="monospace" fill="#1a4a2e" text-anchor="middle">accept</text>
  <line x1="192" y1="107" x2="252" y2="107" stroke="#3b4252" stroke-width="1" marker-end="url(#arrg)"/>
  <text x="222" y="103" font-size="7" font-family="monospace" fill="#3b4252" text-anchor="middle">no</text>

  <text x="273" y="107" font-size="7.5" font-family="monospace" fill="#3b4252" text-anchor="middle">draw r</text>
  <text x="273" y="116" font-size="7.5" font-family="monospace" fill="#3b4252" text-anchor="middle">∈ [0,1]</text>
  <line x1="273" y1="118" x2="273" y2="134" stroke="#3b4252" stroke-width="1" marker-end="url(#arrg)"/>
  <rect x="230" y="134" width="86" height="22" rx="3" fill="#f7f5f0" stroke="#c8a96e" stroke-width="1.5"/>
  <text x="273" y="149" font-size="7.5" font-family="monospace" fill="#8b6a20" text-anchor="middle">r &lt; e^{−βΔE} ?</text>
  <line x1="230" y1="145" x2="48" y2="145" stroke="#1a4a2e" stroke-width="1" marker-end="url(#arrt)"/>

  <line x1="273" y1="156" x2="273" y2="164" stroke="#8b2020" stroke-width="1"/>

  <line x1="28" y1="118" x2="28" y2="160" stroke="#1a4a2e" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="28" y1="160" x2="140" y2="160" stroke="#1a4a2e" stroke-width="0.8" stroke-dasharray="3,2"/>

  <text x="84" y="158" font-size="6.5" font-family="monospace" fill="#94a3b8" text-anchor="middle">new current state → next move</text>
  <defs>

    <marker id="arrg" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L0,5 L5,2.5 Z" fill="#3b4252"/></marker>
  </defs>
</svg>` },

{ type:'glass', title:'GCMC in Practice: Moves', eq:'\\[ P_{\\mathrm{acc}}^{\\mathrm{ins}} = \\min\\!\\left(1,\\, \\frac{V}{N+1}\\frac{z}{\\Lambda^3}\\, e^{-\\beta \\Delta U}\\right) \\]', caption:'The Grand Canonical Monte Carlo (GCMC) requires three types of moves to sample both configuration and particle number.', points:['Displacement (Local diffusion): Particles are moved or rotated to explore local configuration space.', 'Insertion (Adsorption): A new particle is added from the reservoir. Acceptance depends on the fugacity z (related to gas pressure).', 'Deletion (Desorption): A particle is removed back to the reservoir.'], scale:'MONTE CARLO', svg:`<svg viewBox="0 0 300 155" xmlns="http://www.w3.org/2000/svg" style="width:100%;border:1px solid #d0d7e0;border-radius:6px;background:#fff;margin-top:0.5rem;">

  <text x="43" y="36" font-size="8" font-family="monospace" fill="#1a3a5c" text-anchor="middle">reservoir</text>
  <circle cx="22" cy="50" r="3.5" fill="#1a3a5c" opacity="0.5"/>
  <circle cx="38" cy="55" r="3.5" fill="#1a3a5c" opacity="0.5"/>

  <circle cx="30" cy="68" r="3.5" fill="#1a3a5c" opacity="0.5"/>
  <circle cx="50" cy="70" r="3.5" fill="#1a3a5c" opacity="0.5"/>
  <circle cx="20" cy="78" r="3.5" fill="#1a3a5c" opacity="0.5"/>
  <circle cx="62" cy="82" r="3.5" fill="#1a3a5c" opacity="0.5"/>
  <text x="43" y="105" font-size="7" font-family="monospace" fill="#1a3a5c" text-anchor="middle">fixed \u03bc</text>
  <line x1="78" y1="55" x2="110" y2="55" stroke="#c8a96e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="94" y="50" font-size="7" font-family="monospace" fill="#c8a96e" text-anchor="middle">insert</text>

{ type:'text', title:'The 3 Coupled Decisions in MC', body:'Symmetrical to DFT, a Monte Carlo simulation requires three fundamental decisions. The quality of the output depends on the coherence of these choices.', insights:[{label:'1. The Ensemble', text:'NVT, NPT, or μVT. Dictates what fluctuates.'}, {label:'2. Boundary Conditions (PBC)', text:'How to handle finite system sizes and surfaces.'}, {label:'3. The Force Field (FF)', text:'The mathematical approximation of the interatomic potential.'}], scale:'MONTE CARLO' },

{ type:'table', title:'Decision 1: Ensembles', headers:['Ensemble', 'Fixed / Fluctuates', 'Additional Moves', 'Main Application'], scale:'MONTE CARLO', rows:[['NVT', 'N, V, T / E', 'Translation/Rotation', 'Structure, g(r) at fixed density'],['NPT', 'N, P, T / V', 'Box volume change', 'Densities, FF parameterization'],['μVT (GCMC)', 'μ, V, T / N', 'Insertion / Deletion', 'Adsorption isotherms, selectivity']] },

{ type:'text', title:'Decision 2: Boundary Conditions (PBC)', body:'Periodic Boundary Conditions (PBC) eliminate artificial surface effects by wrapping particles around the simulation box edges.', insights:[{label:'Minimum Image Convention', text:'A particle interacts only with the closest periodic image of any other particle, ensuring no self-interaction across boundaries.'}, {label:'Cutoff Radius', text:'Interactions are truncated beyond a radius r_c (typically 12-14 Å) to maintain O(N) scaling, with analytical tail corrections for the remainder.'}], scale:'MONTE CARLO' },

{ type:'solution', title:'Adaptation to Geometry', method:'The PBC must match the physical dimensionality of the material.', finding:'Applying 3D PBC to a 2D surface creates an artificial stack of infinite surfaces interacting with each other. The boundary conditions must reflect the actual confinement geometry.', decision:'For Carbon Nanotubes: 1D PBC (infinite along Z, isolated in X/Y). For Graphene/Slit pores: 2D PBC (infinite in X/Y, isolated in Z with wall potentials). For MOFs/Zeolites: 3D PBC (infinite crystal in all directions).', scale:'MONTE CARLO', solutionImgs:['imagenes_extraidas_metadatos/CONICET_Digital_Nro.3aa22ec7-3999-4437-90f8-451b42595a1c_B/img_p18_3.png','imagenes_extraidas_metadatos/CONICET_Digital_Nro.af8fbc3f-3334-4b6e-a799-c71e50fb86a2_A/img_p6_7.png'] },

{ type:'text', title:'Decision 3: The Force Field (FF)', body:'The force field V(R) is the weakest link. <strong>It determines the physics the simulation can and cannot capture</strong>.', insights:[{label:'Specific vs Generic FFs', text:'TraPPE is specific (top-down), parameterized against fluid phase equilibria. UFF/Dreiding are generic, covering the periodic table but with lower thermodynamic accuracy.'}, {label:'The Rigid Approximation', text:'Most adsorption simulations keep the framework rigid. If the framework flexes significantly during adsorption, fixed coordinates will yield wrong isotherms.'}], scale:'MONTE CARLO' },

{ type:'glass', title:'Coarse-Graining: Force Field Reduction', eq:'\\[ V_{CG}(R) \\approx -k_B T \\ln \\int e^{-\\beta V} dr \\]', caption:'Coarse-Graining (CG) groups atoms into single beads, integrating out internal degrees of freedom to reach larger length and time scales.', points:['Simplifies the force field to simulate micrometers and milliseconds.', 'Sacrifices detailed atomic interactions and active site chemistry.', 'Crucial for large morphological systems like vesicles, micelles, and polymers.'], scale:'COARSE-GRAIN', svg:`<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;border:1px solid #d0d7e0;border-radius:6px;background:#fff;margin-top:0.5rem;">

  <!-- integrate out arrow -->

{ type:'solution', title:'The Force Field Limit', method:'4-to-1 CG vs explicit atom in nanoconfinement', finding:'The CG model faithfully reproduces bulk behavior, but fails quantitatively in extreme confinements (pores < 1nm) where atomic detail dominates packing.', decision:'Use CG for bulk transport and mesopores. Switch to explicit atom representation when the pore is comparable to molecular size or when specific active sites drive the adsorption.', scale:'COARSE-GRAIN', solutionImgs:['imagenes_extraidas_metadatos/hermosilla2019/img_p2_1.png','imagenes_extraidas_metadatos/hermosilla2019/img_p3_2.png'] },

{ type:'problem', title:'Xe in ZIF-8: Standard FF Failure', subtitle:'The gate-opening phenomenon under pressure', atlas:'Atlas #22', scale:'MONTE CARLO' },

{ type:'solution', title:'Xe in ZIF-8: Mixed FF Solution', method:'UFF* (σ) + Dreiding (ε)', finding:'Standard UFF fails to predict the gate-opening adsorption of Xenon in ZIF-8 because its exclusion parameter (σ) is too large for the narrow windows. Dreiding gets the well depth right but the size wrong.', decision:'Design a Mixed Force Field (MFF) combining the effective pore size (σ) from a scaled UFF with the attractive well depth (ε) from Dreiding. The MFF correctly reproduces the full experimental isotherm. Force Fields are not black boxes; parameters must be validated and adjusted for specific physical phenomena.', scale:'MONTE CARLO', solutionImgs:['imagenes_extraidas_metadatos/CONICET_Digital_Nro.af8fbc3f-3334-4b6e-a799-c71e50fb86a2_A/img_p5_6.png'] },

{ type:'text', title:'Selectivity as an Emergent Property', body:'In multicomponent adsorption, selectivity is a battle between <strong>enthalpy and entropy</strong>.', insights:[{label:'Enthalpic Binding', text:'Strong interactions with specific active sites (e.g., exposed metal cations or functional groups).'}, {label:'Entropic Packing', text:'How efficiently molecules pack into the available pore volume depending on their shape and flexibility.'}, {label:'The Winner', text:'At low pressure, enthalpy (strongest sites) dominates. At high pressure, entropy (packing density) wins the pore.'}], scale:'MONTE CARLO' },

{ type:'problem', title:'UiO-66: Pentane Isomers Separation', subtitle:'Modulating Selectivity via Linker Functionalization', atlas:'Atlas #22', scale:'MONTE CARLO', problemImg:'imagenes_extraidas_metadatos/separations-12-00152/img_p2_0.png' },

{ type:'solution', title:'IAST Failure vs GCMC', method:'Direct GCMC Ternary Mixtures vs Ideal Adsorbed Solution Theory', finding:'UiO-66-NH₂ shows high geometric complementarity for neopentane. However, analytical models like IAST systematically overestimate the selectivity because they assume an ideal mixture.', decision:'When the adsorbent has pronounced site heterogeneity (cavities of different sizes and affinities like UiO-66), direct GCMC simulations of mixtures are indispensable. IAST fails by predicting a much easier separation than reality. Direct simulation captures the non-ideal co-adsorption.', scale:'MONTE CARLO', solutionImgs:['imagenes_extraidas_metadatos/separations-12-00152/img_p8_4.png','imagenes_extraidas_metadatos/separations-12-00152/img_p9_5.png'] },

{ type:'text', title:'Molecular Dynamics (MD)', body:'Integration of Newton\'s laws of motion to obtain <strong>physical trajectories over time</strong>.', insights:[{label:'The Capabilities', text:'Yields time-dependent properties: diffusion coefficients, viscosities, and structural relaxation.'}, {label:'The Microsecond Barrier', text:'Integration occurs at femtosecond (10⁻¹⁵ s) intervals. Simulating biological timescales (milliseconds) is a massive computational bottleneck, often requiring Coarse-Graining.'}], scale:'DYNAMICS', svg:`<svg viewBox="0 0 300 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;border:1px solid #d0d7e0;border-radius:6px;background:#fff;">

let current = 0;
const deck = document.getElementById('deck');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function imgPlaceholder(img, svg) {
  if (svg) return `<div style="margin-top:1rem;">${svg}</div>`;
  if (!img) return '';
  const lines = img.split('\n');
  const title = lines[0] || '';
  const desc = lines.slice(1).join(' ');
  return `<div class="img-placeholder"><div class="img-title">${title}</div><p class="img-desc">${desc}</p></div>`;
}

function buildSlide(s, idx) {
  const sec = document.createElement('section');
  sec.className = 'slide';
  const levelKey = (s.scale || '').replace('NIVEL ', '').split(' ')[0];
  const stripeColor = LEVEL_COLORS[s.scale] || '#94a3b8';

  let headerLeft = `<span class="level-tag">${s.scale || ''}</span>`;
  let headerRight = '';
  if (s.atlas) headerRight = `<span class="atlas-tag">${s.atlas}</span>`;

  const header = `<header class="slide-header">${headerLeft}<div class="header-right">${headerRight}</div></header>`;
  const footer = `<footer class="slide-footer">
    <span class="attribution">Albesa · INIFTA-CONICET-UNLP</span>
    <div class="progress-track"><div class="progress-fill" id="fill-${idx}" style="width:${((idx+1)/slideData.length)*100}%"></div></div>
    <span class="slide-num">${String(idx+1).padStart(2,'0')} / ${slideData.length}</span>
  </footer>`;

  let body = '';

  if (s.type === 'title') {
    body = `<div class="slide-body"><div class="slide-title-wrap">
      <div class="eyebrow">INIFTA · CONICET · UNLP</div>
      <h1>${s.title}</h1>
      <div class="title-rule"></div>
      <p class="sub">${s.subtitle}</p>
    </div></div>`;

  } else if (s.type === 'section') {
    body = `<div class="slide-body section-wrap">
      <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${stripeColor};"></div>
      <div class="level-label">${s.scale}</div>
      <h2>${s.title}</h2>
      <p class="section-q">${s.subtitle}</p>
    </div>`;

  } else if (s.type === 'text') {
    const insights = s.insights || [];
    const insightHTML = insights.map(i => `<div class="insight-box"><div class="insight-label">${i.label}</div><p>${i.text}</p></div>`).join('');
    const imgHTML = (s.image || s.svg) ? imgPlaceholder(s.image, s.svg) : '';
    const hasRight = insights.length > 0 || imgHTML;
    body = `<div class="slide-body">
      <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${stripeColor};"></div>
      <div class="text-wrap${hasRight ? '' : ' single'}">
        <div class="text-left">
          <h3>${s.title}</h3>
          <p class="body-text">${s.body || s.content || ''}</p>
        </div>
        ${hasRight ? `<div class="text-right">${insightHTML}${imgHTML}</div>` : ''}
      </div>
    </div>`;

  } else if (s.type === 'glass') {
    const points = s.points || [];
    const ptHTML = points.map(p => `<div class="eq-point"><div class="dot"></div><p>${p}</p></div>`).join('');
    const imgHTML = (s.image || s.svg) ? imgPlaceholder(s.image, s.svg) : '';
    body = `<div class="slide-body" style="justify-content:flex-start;padding-top:1.5rem;">
      <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${stripeColor};"></div>
      <div class="eq-wrap">
        <div class="eq-left">
          <h3>${s.title}</h3>
          <div class="eq-box">${s.eq || s.content || ''}</div>
          <p class="eq-caption">${s.caption || s.subtitle || ''}</p>
          ${imgHTML}
        </div>
        <div class="eq-right">${ptHTML}</div>
      </div>
    </div>`;

  } else if (s.type === 'problem') {
    if (s.problemImg) {
      body = `<div class="slide-body">
        <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:#8b2020;"></div>
        <div class="problem-wrap-with-img">
          <div class="problem-text">
            <div class="problem-eyebrow"><span class="problem-badge">Design challenge</span>${s.atlas ? `<span class="problem-badge" style="color:var(--accent);border-color:var(--accent)">${s.atlas}</span>` : ''}</div>
            <h3>${s.title}</h3>
            <div class="problem-context">${s.subtitle}</div>
          </div>
          <div class="paper-img-container">
            <img class="paper-img" src="${s.problemImg}" alt="Structure under evaluation" loading="lazy"/>
            <span class="paper-img-caption">Structure under evaluation</span>
          </div>
        </div>
      </div>`;
    } else {
      body = `<div class="slide-body">
        <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:#8b2020;"></div>
        <div class="problem-wrap">
          <div class="problem-eyebrow"><span class="problem-badge">Design challenge</span>${s.atlas ? `<span class="problem-badge" style="color:var(--accent);border-color:var(--accent)">${s.atlas}</span>` : ''}</div>
          <h3>${s.title}</h3>
          <div class="problem-context">${s.subtitle}</div>
        </div>
      </div>`;
    }

  } else if (s.type === 'solution') {
    const solImgsHTML = s.solutionImgs ? `<div class="solution-images">${s.solutionImgs.map(src => `<img src="${src}" alt="Evidence" loading="lazy"/>`).join('')}</div>` : '';
    if (s.solutionImgs) {
      body = `<div class="slide-body" style="justify-content:flex-start;padding-top:2rem;">
        <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:#1a4a2e;"></div>
        <div class="solution-wrap-3col">
          <div class="solution-left">
            <h3>${s.title}</h3>
            <span class="method-tag">${s.method || s.subtitle || ''}</span>
            <p class="finding">${s.finding || s.content || ''}</p>
          </div>
          <div class="decision-card">
            <div class="dec-label">Design decision</div>
            <p class="dec-text">${s.decision}</p>
          </div>
          <div style="display:flex;flex-direction:column;gap:0.75rem;">
            ${s.solutionImgs.map(src => `<img class="paper-img" src="${src}" alt="Evidence" loading="lazy"/>`).join('')}
          </div>
        </div>
      </div>`;
    } else {
      body = `<div class="slide-body">
        <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:#1a4a2e;"></div>
        <div class="solution-wrap">
          <div class="solution-left">
            <h3>${s.title}</h3>
            <span class="method-tag">${s.method || s.subtitle || ''}</span>
            <p class="finding">${s.finding || s.content || ''}</p>
          </div>
          <div class="decision-card">
            <div class="dec-label">Design decision</div>
            <p class="dec-text">${s.decision}</p>
          </div>
        </div>
      </div>`;
    }

  } else if (s.type === 'table') {
    const rows = s.rows || [];
    const headers = s.headers || ['Model', 'Type', 'Description and features', 'When to use it'];
    const rowsHTML = rows.map(r => `<tr>
      <td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td>
    </tr>`).join('');
    body = `<div class="slide-body" style="justify-content:flex-start;padding-top:2rem;">
      <div class="table-wrap">
        <h3>${s.title}</h3>
        <table class="methods-table">
          <thead><tr><th>${headers[0]}</th><th>${headers[1]}</th><th>${headers[2]}</th><th>${headers[3]}</th></tr></thead>
          <tbody>${rowsHTML}</tbody>
        </table>
      </div>
    </div>`;


  } else if (s.type === 'final') {
    body = `<div class="slide-body final-wrap">
      <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${stripeColor};"></div>
      <h1>${s.title}</h1>
      <div class="title-rule"></div>
      <p class="contact">${s.contact}</p>
    </div>`;
  }

  sec.innerHTML = header + body + footer;
  return sec;
}

function render() {
  deck.innerHTML = '';
  slideData.forEach((s, i) => deck.appendChild(buildSlide(s, i)));
  go(0);
}

function go(n) {
  current = Math.max(0, Math.min(slideData.length - 1, n));
  deck.style.transform = `translateX(-${current * 100}vw)`;
  prevBtn.style.opacity = current === 0 ? '0.3' : '1';
  nextBtn.style.opacity = current === slideData.length - 1 ? '0.3' : '1';
  if (window.MathJax) MathJax.typesetPromise();
}

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') go(current + 1);
  if (e.key === 'ArrowLeft') go(current - 1);
});
prevBtn.addEventListener('click', () => go(current - 1));
nextBtn.addEventListener('click', () => go(current + 1));

render();
</script>
